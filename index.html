<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Chácara Retro - Typewriter Arena</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

    body {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'Fredoka One', cursive, sans-serif;
      background: #2b1055; display: flex; justify-content: center; align-items: center;
    }

    #auth-screen {
      position: absolute; width: 100%; height: 100%;
      background: rgba(43, 16, 85, 0.98); z-index: 200;
      display: flex; justify-content: center; align-items: center;
    }
    .auth-card {
      background: #ffdd59; border: 4px solid #000; border-radius: 20px;
      padding: 25px; width: 340px; text-align: center; box-shadow: 8px 8px 0px #000;
    }
    .auth-card h2 { font-size: 24px; margin-bottom: 12px; }
    .input-group { margin-bottom: 10px; text-align: left; }
    .input-group label { display: block; font-size: 11px; margin-bottom: 2px; }
    .input-group input { width: 100%; padding: 8px; border: 3px solid #000; border-radius: 10px; font-family: inherit; }
    .avatar-preview { width: 45px; height: 45px; border: 3px solid #000; border-radius: 50%; background: #fff; object-fit: cover; }
    .btn-action {
      width: 100%; background: #2ed573; border: 3px solid #000; padding: 10px;
      font-size: 16px; font-family: inherit; border-radius: 12px; cursor: pointer;
      box-shadow: 4px 4px 0px #000; margin-top: 8px;
    }

    #main-wrapper {
      display: none; flex-direction: column; width: 98vw; max-width: 1100px; height: 96vh; position: relative;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .btn-ctrl {
      background: #ff4757; color: white; border: 3px solid #000; padding: 4px 10px;
      border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 12px; box-shadow: 2px 2px 0px #000;
      margin-left: 4px; text-decoration: none; display: inline-block;
    }

    #digital-clock {
      background: #000; color: #00ffcc; font-family: monospace; font-size: 16px;
      padding: 4px 10px; border-radius: 8px; border: 2px solid #ffdd59; text-shadow: 0 0 5px #00ffcc;
    }

    #game-container {
      flex: 1; background-color: #57606f; border: 4px solid #000; border-radius: 20px;
      padding: 8px; box-shadow: 8px 8px 0px #000; display: flex; flex-direction: column; position: relative;
    }

    #battle-screen {
      height: 52%; background: linear-gradient(to bottom, #70a1ff 0%, #7bed9f 75%, #2ed573 100%);
      border: 4px solid #000; border-radius: 16px; position: relative;
      display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 80px; overflow: hidden;
    }

    #overlay-chat {
      position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
      pointer-events: none; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end;
    }
    #chat-stream { display: flex; flex-direction: column; gap: 4px; max-height: 100px; overflow: hidden; }
    .chat-line {
      background: rgba(0, 0, 0, 0.35); color: #fff; padding: 2px 8px; border-radius: 6px;
      font-size: 12px; width: fit-content; text-shadow: 1px 1px 0px #000; backdrop-filter: blur(2px);
    }
    #chat-input-bar { pointer-events: auto; margin-top: 4px; display: flex; gap: 6px; width: 220px; }
    #chat-input-bar input {
      flex: 1; background: rgba(0,0,0,0.4); border: 2px solid #fff; color: #fff;
      border-radius: 8px; padding: 3px 6px; font-size: 11px; outline: none;
    }

    .player-box { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 4; }
    .avatar-frame { width: 50px; height: 50px; border: 3px solid #000; border-radius: 50%; overflow: hidden; background: #fff; margin-bottom: 2px; }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    .hero-graphic { width: 90px; height: 120px; filter: drop-shadow(4px 4px 0px #000); }

    .word-projectile {
      position: absolute; font-size: 15px; padding: 4px 10px; border-radius: 12px;
      white-space: nowrap; z-index: 10; pointer-events: none; border: 3px solid #000; box-shadow: 3px 3px 0px #000; transition: left 3.5s linear;
    }
    .p1-word { background: #7bed9f; color: #000; }
    .p2-word { background: #ff4757; color: #fff; }

    .hp-bar-container { width: 110px; height: 12px; background-color: #fff; border: 2px solid #000; border-radius: 6px; overflow: hidden; margin-top: 2px; }
    .hp-fill { height: 100%; width: 100%; transition: width 0.3s; }
    #p1-hp { background-color: #2ed573; }
    #p2-hp { background-color: #ff4757; }

    #typing-panel {
      height: 38%; background-color: #2f3542; border: 4px solid #000; border-radius: 16px;
      padding: 6px; display: flex; flex-direction: column; justify-content: space-between; margin-top: 4px;
    }
    #text-display { font-size: 18px; letter-spacing: 2px; padding: 6px; background-color: #fff; border: 3px solid #000; border-radius: 10px; color: #2f3542; text-align: center; }
    .char-correct { color: #2ed573; text-shadow: 1px 1px 0px #000; }
    .char-current { background-color: #ff4757; color: #fff; border-radius: 4px; padding: 0 4px; }
    .char-pending { color: #a4b0be; }

    #keyboard { display: flex; justify-content: center; gap: 5px; }
    .key { flex: 1; max-width: 55px; height: 36px; background: #eccc68; border: 3px solid #000; color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .key.active { background: #ff4757; color: #fff; transform: translate(2px, 2px); }

    #bottom-widgets { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; height: 85px; }
    
    .widget-panel {
      background: #ffdd59; border: 3px solid #000; border-radius: 12px; padding: 6px;
      box-shadow: 3px 3px 0px #000; display: flex; flex-direction: column; font-size: 11px;
    }

    #left-widget { width: 28%; overflow-y: auto; }
    #mid-widget { width: 42%; text-align: center; overflow-y: auto; }
    #right-widget { width: 28%; overflow-y: auto; }

    .widget-title { font-size: 10px; text-transform: uppercase; color: #000; margin-bottom: 2px; border-bottom: 2px solid #000; padding-bottom: 1px; }
    .record-item { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; }
    
    .online-user-btn {
      background: #7bed9f; border: 2px solid #000; border-radius: 6px; padding: 2px 6px;
      margin-top: 2px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: inherit; font-size: 10px;
    }
    .online-user-btn:hover { background: #2ed573; }

    #challenge-popover {
      position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
      background: #ff4757; color: #fff; border: 4px solid #000; border-radius: 16px;
      padding: 15px; z-index: 300; text-align: center; box-shadow: 6px 6px 0px #000; display: none; width: 280px;
    }
    .challenge-btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .btn-pop { border: 2px solid #000; padding: 6px 14px; border-radius: 8px; font-family: inherit; cursor: pointer; font-weight: bold; }

    #modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 150;
    }
    #modal-box { background: #ffdd59; border: 4px solid #000; padding: 20px; border-radius: 16px; text-align: center; width: 320px; }
    
    .creator-badge { color: #ff9f1a; text-shadow: 1px 1px 0px #000; font-weight: bold; font-size: 10px; display: block; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2>REGISTRO DE JOGADOR</h2>
      <div class="input-group">
        <label>Nome do Jogador:</label>
        <input type="text" id="reg-username" placeholder="Seu Nickname..." maxlength="12">
      </div>
      <div class="input-group">
        <label>Senha:</label>
        <input type="password" id="reg-password" placeholder="Digite a senha...">
      </div>
      <div class="input-group">
        <label>Foto de Perfil:</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <img id="avatar-preview-img" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='35' r='25' fill='%23ccc'/><path d='M10 90 Q50 50 90 90' fill='%23ccc'/></svg>">
          <input type="file" id="reg-avatar" accept="image/*" style="font-size:10px;">
        </div>
      </div>
      <button class="btn-action" id="btn-enter-game">CADASTRAR E ENTRAR</button>
    </div>
  </div>

  <div id="main-wrapper">
    <div class="top-bar">
      <div style="color:#ffdd59; font-size:14px;" id="room-display">MODO TREINO (MAQUINA)</div>
      <div style="display:flex; align-items:center;">
        <div id="digital-clock">00:00:00</div>
        <button class="btn-ctrl" id="btn-audio">🔊 ÁUDIO: ON</button>
        <button class="btn-ctrl" id="btn-music" style="background:#eccc68; color:#000;">🎤 MÚSICA: VOCAL FREESTYLE</button>
        <button class="btn-ctrl" id="btn-subscribe" style="background:#2ed573; color:#000;">📝 SE INSCREVER</button>
        <button class="btn-ctrl" id="btn-fullscreen">⛶ TELA CHEIA</button>
      </div>
    </div>

    <div id="game-container">
      <div id="battle-screen">
        <div id="overlay-chat">
          <div id="chat-stream">
            <div class="chat-line"><strong>Sistema:</strong> Arena pronta para batalhas!</div>
          </div>
          <div id="chat-input-bar">
            <input type="text" id="chat-text" placeholder="Chat..." maxlength="25">
          </div>
        </div>

        <div class="player-box" id="p1-box">
          <div class="avatar-frame"><img id="p1-avatar-img" src=""></div>
          <svg class="hero-graphic" viewBox="0 0 100 140">
            <rect x="35" y="100" width="10" height="28" fill="#2c3e50" stroke="#000" stroke-width="2"/>
            <rect x="55" y="100" width="10" height="28" fill="#2c3e50" stroke="#000" stroke-width="2"/>
            <path d="M 20 45 L 35 30 L 65 30 L 80 45 L 75 100 L 25 100 Z" fill="#ffffff" stroke="#000" stroke-width="3"/>
            <circle cx="50" cy="20" r="15" fill="#f1c40f" stroke="#000" stroke-width="3"/>
          </svg>
          <strong id="p1-name" style="color:#000; font-size:11px;">P1</strong>
          <span id="p1-badge"></span>
          <div class="hp-bar-container"><div id="p1-hp" class="hp-fill"></div></div>
        </div>

        <div class="player-box" id="p2-box">
          <div class="avatar-frame"><img id="p2-avatar-img" src=""></div>
          <svg class="hero-graphic" viewBox="0 0 100 140" style="transform: scaleX(-1);">
            <rect x="35" y="100" width="10" height="28" fill="#8e44ad" stroke="#000" stroke-width="2"/>
            <rect x="55" y="100" width="10" height="28" fill="#8e44ad" stroke="#000" stroke-width="2"/>
            <path d="M 20 45 L 35 30 L 65 30 L 80 45 L 75 100 L 25 100 Z" fill="#e74c3c" stroke="#000" stroke-width="3"/>
            <circle cx="50" cy="20" r="15" fill="#e67e22" stroke="#000" stroke-width="3"/>
          </svg>
          <strong id="p2-name" style="color:#000; font-size:11px;">Máquina</strong>
          <span id="p2-badge"></span>
          <div class="hp-bar-container"><div id="p2-hp" class="hp-fill"></div></div>
        </div>
      </div>

      <div id="typing-panel">
        <div id="text-display"></div>
        <div id="keyboard">
          <div class="key" id="key-A">A</div>
          <div class="key" id="key-S">S</div>
          <div class="key" id="key-D">D</div>
          <div class="key" id="key-F">F</div>
          <div class="key" id="key-J">J</div>
          <div class="key" id="key-K">K</div>
          <div class="key" id="key-L">L</div>
          <div class="key" id="key-Ç">Ç</div>
        </div>
      </div>

      <div id="bottom-widgets">
        <div class="widget-panel" id="left-widget">
          <div class="widget-title">RANKING MANO A MANO</div>
          <div id="mano-mano-records">Sem pontuação</div>
        </div>

        <div class="widget-panel" id="mid-widget">
          <div class="widget-title">RANKING BATALHAS ONLINE</div>
          <div id="online-records">Sem pontuação</div>
        </div>

        <div class="widget-panel" id="right-widget">
          <div class="widget-title">JOGADORES CONECTADOS</div>
          <div id="online-users-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="challenge-popover">
    <div><strong style="font-size:14px;">NOVO ADVERSÁRIO ENTROU!</strong></div>
    <div id="challenge-text-name" style="margin-top:6px; font-size:12px;">Desafio global disponível!</div>
    <div class="challenge-btns">
      <button class="btn-pop" style="background:#2ed573; color:#000;" id="btn-accept-challenge">ACEITAR</button>
      <button class="btn-pop" style="background:#fff; color:#000;" id="btn-decline-challenge">RECUSAR</button>
    </div>
  </div>

  <div id="modal-overlay">
    <div id="modal-box">
      <h3 id="modal-title">Fase Concluída!</h3>
      <p id="modal-stats" style="margin-top:8px; font-size:13px; font-weight:bold;"></p>
      <button class="btn-action" id="modal-btn">CONTINUAR</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let isAudioMuted = false;
    let isVsMachine = true;
    let pendingChallenger = null;
    let currentChallengeId = null;
    let totalScore = 0; 
    let machineAttackInterval = null;

    const phrasesEasy = ["ASDF JKLÇ", "FADA SASA", "LADA KAKA", "SALA DADO"];
    const phrasesMedium = ["O CORAJOSO GUERREIRO AVANCA NA ARENA", "LARA CROFT EXPLORA A TUMBA PERIGOSA", "SUPER MARIO CORRE PARA SALVAR A PRINCESA"];
    const phrasesHard = ["MECANICAS RETRO DESAFIAM OS JOGADORES MAIS RAPIDOS NA DIGITACAO", "A VELOCIDADE DO ATAQUE AUMENTA CONFORME OS PONTOS SAO ACUMULADOS"];

    function getDynamicText() {
      if (totalScore < 10) return phrasesEasy[Math.floor(Math.random() * phrasesEasy.length)];
      if (totalScore < 20) return phrasesMedium[Math.floor(Math.random() * phrasesMedium.length)];
      return phrasesHard[Math.floor(Math.random() * phrasesHard.length)];
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('digital-clock').innerText = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- SINTETIZADOR DE VOZ HUMANA / BEATBOX FREESTYLE (WEB AUDIO API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Síntese Formântica de Voz Humana
    function playVocalSynth(freq, duration, vowelType = 'a') {
      if (isAudioMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Formantes aproximados para vogais humanas
      const f1 = audioCtx.createBiquadFilter();
      const f2 = audioCtx.createBiquadFilter();
      f1.type = 'bandpass'; f2.type = 'bandpass';

      if (vowelType === 'a') {
        f1.frequency.value = 800; f2.frequency.value = 1150;
      } else { // 'o'
        f1.frequency.value = 400; f2.frequency.value = 800;
      }

      osc.type = 'sawtooth'; // Onda dente de serra simula cordas vocais humanas
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(f1); osc.connect(f2);
      f1.connect(gain); f2.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Batida de Beatbox / Freestyle Drums
    function playBeatboxKick() {
      if (isAudioMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }

    // Sequência de Freestyle Vocal Loop
    const freestyleSequence = [
      { f: 220.00, d: 0.25, v: 'a' }, { f: 0, d: 0.15 }, { f: 261.63, d: 0.20, v: 'o' },
      { f: 293.66, d: 0.30, v: 'a' }, { f: 0, d: 0.10 }, { f: 220.00, d: 0.20, v: 'a' },
      { f: 329.63, d: 0.35, v: 'o' }, { f: 293.66, d: 0.25, v: 'a' }
    ];

    let musicTimer = null;
    let freestyleStep = 0;

    function playFreestyleLoop() {
      if (isAudioMuted) return;
      
      const item = freestyleSequence[freestyleStep];
      if (item.f > 0) {
        playVocalSynth(item.f, item.d, item.v);
      }
      if (freestyleStep % 2 === 0) {
        playBeatboxKick();
      }

      freestyleStep = (freestyleStep + 1) % freestyleSequence.length;
      musicTimer = setTimeout(playFreestyleLoop, 320);
    }

    function startMusic() {
      if (musicTimer) clearTimeout(musicTimer);
      freestyleStep = 0;
      playFreestyleLoop();
    }

    function stopMusic() {
      if (musicTimer) clearTimeout(musicTimer);
      musicTimer = null;
    }

    function playTigerRoar() {
      if (isAudioMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(150, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.4);
      filter.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 1.2);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(1.5, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.4);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
      noise.stop(audioCtx.currentTime + 1.4);
    }

    function speakNewChallenger() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("Novo adversário, aceitar o desafio");
        msg.lang = 'pt-BR';
        msg.rate = 1.0;
        msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    function playTypewriterSound() {
      if (isAudioMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const bufferSize = audioCtx.sampleRate * 0.04;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(); noise.stop(audioCtx.currentTime + 0.04);
    }

    document.getElementById('btn-audio').addEventListener('click', () => {
      isAudioMuted = !isAudioMuted;
      document.getElementById('btn-audio').innerText = isAudioMuted ? "🔇 ÁUDIO: OFF" : "🔊 ÁUDIO: ON";
      if (isAudioMuted) stopMusic();
      else startMusic();
    });

    document.getElementById('btn-subscribe').addEventListener('click', () => {
      document.getElementById('auth-screen').style.display = 'flex';
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    document.getElementById('reg-avatar').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { document.getElementById('avatar-preview-img').src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btn-enter-game').addEventListener('click', () => {
      const name = document.getElementById('reg-username').value.trim();
      const pass = document.getElementById('reg-password').value.trim();

      if (!name || !pass) {
        alert("Digite um Nome e Senha para registrar!");
        return;
      }

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const isCreator = (pass.toLowerCase() === "chacara123");

      currentUser = {
        name: name,
        avatar: document.getElementById('avatar-preview-img').src,
        isCreator: isCreator,
        manoScore: currentUser ? currentUser.manoScore : 0,
        onlineScore: currentUser ? currentUser.onlineScore : 0
      };

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-wrapper').style.display = 'flex';

      if (currentUser.isCreator) {
        document.getElementById('p1-name').innerText = `👑 ${currentUser.name}`;
        document.getElementById('p1-badge').innerHTML = `<span class="creator-badge">[CRIADOR DO JOGO]</span>`;
      } else {
        document.getElementById('p1-name').innerText = currentUser.name;
        document.getElementById('p1-badge').innerHTML = ``;
      }
      
      document.getElementById('p1-avatar-img').src = currentUser.avatar;

      startMusic();

      connectedUsers[currentUser.name] = currentUser;

      // DISPARO GLOBAL DE NOVO ENTRANTE PARA TODAS AS ABAS ABERTAS
      const newChallengeId = 'challenge_' + Date.now();
      broadcastSystem.postMessage({ type: 'global_new_player', challenger: currentUser, challengeId: newChallengeId });
      broadcastSystem.postMessage({ type: 'ping_all' });

      updateUserList();
      resetGame();
    });

    // --- REDE BROADCAST PARA TODAS AS ABAS ---
    const broadcastSystem = new BroadcastChannel('chacara_arena_network_v5');
    let connectedUsers = {};
    let scoresDatabase = [];

    broadcastSystem.onmessage = (e) => {
      const data = e.data;

      if (data.type === 'global_new_player') {
        connectedUsers[data.challenger.name] = data.challenger;
        updateUserList();

        // EMITE O SOM DO TIGRE E A MENSAGEM DE DESAFIO EM TODAS AS ABAS QUE NÃO FOREM DO PRÓPRIO JOGADOR
        if (currentUser && data.challenger.name !== currentUser.name) {
          triggerChallengerAlert(data.challenger, data.challengeId);
          appendChatMessage("Sistema", `⚡ ${data.challenger.name} entrou na arena!`);
        }
      } 
      else if (data.type === 'challenge_taken') {
        // SE OUTRA ABA JÁ ACEITOU O DESAFIO, CANCELA O POPUP NAS OUTRAS ABAS
        if (currentChallengeId === data.challengeId) {
          document.getElementById('challenge-popover').style.display = 'none';
          pendingChallenger = null;
          if (currentUser && currentUser.name !== data.acceptedBy) {
            appendChatMessage("Sistema", `ℹ️ O desafio de ${data.challengerName} foi aceito por ${data.acceptedBy}. Aguarde o próximo!`);
          }
        }
      }
      else if (data.type === 'ping_all' && currentUser) {
        broadcastSystem.postMessage({ type: 'pong_user', user: currentUser });
      } 
      else if (data.type === 'pong_user') {
        connectedUsers[data.user.name] = data.user;
        updateUserList();
      }
      else if (data.type === 'chat') {
        appendChatMessage(data.user, data.msg);
      } 
      else if (data.type === 'scores_update') {
        updateLeaderboardsUI(data.scores);
      }
    };

    function updateUserList() {
      const list = document.getElementById('online-users-list');
      list.innerHTML = "";
      Object.keys(connectedUsers).forEach(uName => {
        const u = connectedUsers[uName];
        const btn = document.createElement('button');
        btn.className = 'online-user-btn';
        const isSelf = currentUser && uName === currentUser.name;
        
        const titleText = u.isCreator ? `👑 ${uName} [CRIADOR]` : uName;
        btn.innerHTML = `<span>${titleText} ${isSelf ? '(Você)' : ''}</span> ${!isSelf ? '<span>⚔️ Lutar</span>' : ''}`;
        
        if (!isSelf) {
          btn.onclick = () => sendDirectChallenge(u);
        }
        list.appendChild(btn);
      });
    }

    function triggerChallengerAlert(challenger, challengeId) {
      pendingChallenger = challenger;
      currentChallengeId = challengeId;
      const nameText = challenger.isCreator ? `👑 ${challenger.name} [CRIADOR]` : challenger.name;
      document.getElementById('challenge-text-name').innerText = `${nameText} entrou! Primeiro a aceitar joga!`;
      document.getElementById('challenge-popover').style.display = 'block';

      // Som de Rugido de Tigre e Voz Sintetizada em Todas as Abas
      playTigerRoar();
      speakNewChallenger();
    }

    function sendDirectChallenge(targetUser) {
      const directId = 'challenge_' + Date.now();
      broadcastSystem.postMessage({ type: 'global_new_player', challenger: currentUser, challengeId: directId });
    }

    document.getElementById('btn-accept-challenge').addEventListener('click', () => {
      document.getElementById('challenge-popover').style.display = 'none';
      if (pendingChallenger && currentChallengeId) {
        // AVISA A TODAS AS OUTRAS ABAS QUE ESTE JOGO JÁ FOI ACEITO POR ESTA ABA
        broadcastSystem.postMessage({ 
          type: 'challenge_taken', 
          challengeId: currentChallengeId, 
          acceptedBy: currentUser.name,
          challengerName: pendingChallenger.name
        });

        startMultiplayerMatch(pendingChallenger);
      }
    });

    document.getElementById('btn-decline-challenge').addEventListener('click', () => {
      document.getElementById('challenge-popover').style.display = 'none';
      pendingChallenger = null;
    });

    function startMultiplayerMatch(opponent) {
      isVsMachine = false;
      document.getElementById('room-display').innerText = `MODO BATALHA VS ${opponent.name.toUpperCase()}`;
      
      if (opponent.isCreator) {
        document.getElementById('p2-name').innerText = `👑 ${opponent.name}`;
        document.getElementById('p2-badge').innerHTML = `<span class="creator-badge">[CRIADOR DO JOGO]</span>`;
      } else {
        document.getElementById('p2-name').innerText = opponent.name;
        document.getElementById('p2-badge').innerHTML = ``;
      }
      
      document.getElementById('p2-avatar-img').src = opponent.avatar;
      resetGame();
    }

    let currentText = "";
    let charIndex = 0;
    let p1HP = 100, p2HP = 100;

    function renderText() {
      let html = "";
      for (let i = 0; i < currentText.length; i++) {
        let char = currentText[i] === " " ? "&nbsp;" : currentText[i];
        if (i < charIndex) html += `<span class="char-correct">${char}</span>`;
        else if (i === charIndex) {
          html += `<span class="char-current">${char}</span>`;
          highlightKey(currentText[i]);
        } else html += `<span class="char-pending">${char}</span>`;
      }
      document.getElementById('text-display').innerHTML = html;
    }

    function highlightKey(char) {
      document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
      const keyElem = document.getElementById(`key-${char.toUpperCase()}`);
      if (keyElem) keyElem.classList.add('active');
    }

    function fireProjectile(isP1, text) {
      const arena = document.getElementById('battle-screen');
      const proj = document.createElement('div');
      proj.className = `word-projectile ${isP1 ? 'p1-word' : 'p2-word'}`;
      proj.innerText = text;

      const startX = isP1 ? 80 : arena.clientWidth - 180;
      const targetX = isP1 ? arena.clientWidth - 180 : 80;

      proj.style.left = `${startX}px`;
      proj.style.top = `60px`;
      arena.appendChild(proj);

      setTimeout(() => { proj.style.left = `${targetX}px`; }, 50);

      setTimeout(() => {
        proj.remove();
        if (isP1) {
          p2HP -= 25;
          document.getElementById('p2-hp').style.width = `${Math.max(0, p2HP)}%`;
          if (p2HP <= 0) handleRoundWin();
        } else {
          p1HP -= 15;
          document.getElementById('p1-hp').style.width = `${Math.max(0, p1HP)}%`;
          if (p1HP <= 0) handleRoundLoss();
        }
      }, 2500);
    }

    function handleRoundWin() {
      totalScore += 10;
      if (currentUser) {
        if (!isVsMachine) {
          currentUser.manoScore += 10;
        } else {
          currentUser.onlineScore += 10;
        }
        syncAndRenderScores();
      }
      showModal("VITÓRIA!", `Pontuação: +10 Pts. A dificuldade dos textos aumentou!`);
    }

    function handleRoundLoss() {
      showModal("DERROTA!", "Melhore sua rapidez e tente novamente!");
    }

    function syncAndRenderScores() {
      let recordObj = {
        name: currentUser ? currentUser.name : "Visitante",
        isCreator: currentUser ? currentUser.isCreator : false,
        manoScore: currentUser ? currentUser.manoScore : 0,
        onlineScore: currentUser ? currentUser.onlineScore : 0
      };

      const existing = scoresDatabase.find(s => s.name === recordObj.name);
      if (existing) {
        existing.manoScore = recordObj.manoScore;
        existing.onlineScore = recordObj.onlineScore;
      } else {
        scoresDatabase.push(recordObj);
      }

      broadcastSystem.postMessage({ type: 'scores_update', scores: scoresDatabase });
      updateLeaderboardsUI(scoresDatabase);
    }

    function updateLeaderboardsUI(scores) {
      const manoList = document.getElementById('mano-mano-records');
      const onlineList = document.getElementById('online-records');

      manoList.innerHTML = scores
        .sort((a,b) => b.manoScore - a.manoScore)
        .map(s => `<div class="record-item"><span>⚔️ ${s.isCreator ? '👑 ' : ''}${s.name}</span> <span>${s.manoScore} Pts</span></div>`)
        .join('');

      onlineList.innerHTML = scores
        .sort((a,b) => b.onlineScore - a.onlineScore)
        .map(s => `<div class="record-item"><span>🌐 ${s.isCreator ? '👑 ' : ''}${s.name}</span> <span>${s.onlineScore} Pts</span></div>`)
        .join('');
    }

    window.addEventListener('keydown', (e) => {
      if (document.getElementById('modal-overlay').style.display === 'flex') return;
      if (document.activeElement === document.getElementById('chat-text')) return;
      if (e.key.length > 1 && e.key !== 'Dead') return;

      playTypewriterSound();

      if (e.key.toUpperCase() === currentText[charIndex].toUpperCase() || (currentText[charIndex] === ' ' && e.key === ' ')) {
        charIndex++;
        if (charIndex >= currentText.length) {
          fireProjectile(true, "Ataque!");
          charIndex = 0;
          currentText = getDynamicText();
        }
      } else {
        fireProjectile(false, "Errou!");
      }
      renderText();
    });

    function showModal(title, msg) {
      clearInterval(machineAttackInterval);
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-stats').innerText = msg;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    document.getElementById('modal-btn').addEventListener('click', () => {
      document.getElementById('modal-overlay').style.display = 'none';
      resetGame();
    });

    function resetGame() {
      p1HP = 100; p2HP = 100; charIndex = 0;
      document.getElementById('p1-hp').style.width = '100%';
      document.getElementById('p2-hp').style.width = '100%';
      currentText = getDynamicText();
      renderText();

      clearInterval(machineAttackInterval);
      if (isVsMachine) {
        let speed = Math.max(1000, 3800 - (totalScore * 120));
        machineAttackInterval = setInterval(() => {
          if (Math.random() > 0.3) fireProjectile(false, "Ataque IA!");
        }, speed);
      }
    }

    const chatInput = document.getElementById('chat-text');
    const chatStream = document.getElementById('chat-stream');

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim()) {
        const msg = chatInput.value.trim();
        const uName = currentUser ? (currentUser.isCreator ? `👑 ${currentUser.name}` : currentUser.name) : "Visitante";
        appendChatMessage(uName, msg);
        broadcastSystem.postMessage({ type: 'chat', user: uName, msg: msg });
        chatInput.value = '';
      }
    });

    function appendChatMessage(user, msg) {
      const line = document.createElement('div');
      line.className = 'chat-line';
      line.innerHTML = `<strong>${user}:</strong> ${msg}`;
      chatStream.appendChild(line);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    currentText = getDynamicText();
    renderText();
  </script>
</body>
</html>
